# Renders the real app screens with demo data for the store listings and commits them to
# store_screens/goldens/. Run from Actions > Store screenshots > Run workflow.
name: Store screenshots
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Render screens
        run: flutter test store_screens --update-goldens --dart-define=LOANS_ENABLED=false
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store_screens/goldens
          git commit -m "Store screenshots" || echo "No changes"
          git push
