# Builds the Google Play release (Android App Bundle, .aab) with loans switched off.
# Run from Actions > Google Play build > Run workflow, then upload the .aab from the
# "Google Play build" release (or the run's Artifacts) to Play Console.
# Needs repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_UPLOAD_KEYSTORE_B64       contents of momwealth-upload-keystore.b64.txt
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD  the password from the same handover file
name: Google Play build
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets and Firebase settings
        env:
          KS_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KS_B64" ] && [ -n "$KS_PW" ] || { echo "Add the ANDROID_UPLOAD_KEYSTORE_B64 and ANDROID_UPLOAD_KEYSTORE_PASSWORD secrets first."; exit 1; }
          if grep -q "1489d3423088bb6302802b" lib/firebase_options.dart; then
            echo "lib/firebase_options.dart still uses the old Android app (com.mycompany.momwealth). Add the com.momrehoboth.momwealth Android app in Firebase and update the values first."; exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create and configure platform folders
        run: ./tool/configure_platforms.sh
      - name: Upload key
        env:
          KS_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | tr -d '\n\r ' | base64 -d > android/app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=upload\n' "$KS_PW" "$KS_PW" > android/key.properties
      - name: Build app bundle (loans off)
        run: flutter build appbundle --release --dart-define=LOANS_ENABLED=false --build-number=$((GITHUB_RUN_NUMBER + 100))
      - uses: actions/upload-artifact@v4
        with:
          name: momwealth-play-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Publish to the "Google Play build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$((GITHUB_RUN_NUMBER + 100))
          cp build/app/outputs/bundle/release/app-release.aab "MOMWealth-play-$N.aab"
          gh release view play-build >/dev/null 2>&1 || gh release create play-build --prerelease --title "Google Play build" --notes "Upload the .aab to Play Console."
          gh release upload play-build "MOMWealth-play-$N.aab" --clobber
          gh release edit play-build --notes "Latest Google Play build: version code $N (loans off), from ${GITHUB_SHA::7}. Upload MOMWealth-play-$N.aab to Play Console > Testing > Closed testing > Create new release."
