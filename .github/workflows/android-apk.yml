# Builds an installable Android APK for testing. Creates the platform folders on the fly if they
# aren't committed yet. Download the APK from the run's "Artifacts" section.
name: Android test APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: Create and configure platform folders
        run: ./tool/configure_platforms.sh
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true
      - name: Build APK (release, test-signed)
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: momwealth-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - name: Publish to the "Test build" release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk MOMWealth-test.apk
          gh release view test-build >/dev/null 2>&1 || gh release create test-build --prerelease --title "Test build (Android)" --notes "Latest test APK. Install on Android: download, open, allow install from this source."
          gh release upload test-build MOMWealth-test.apk --clobber
          gh release edit test-build --notes "Latest test APK, build ${{ github.run_number }} from ${GITHUB_SHA::7}. Download MOMWealth-test.apk on the phone, open it and allow installing from this source."
