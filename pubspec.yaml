name: momwealth
description: MOM Wealth member app - savings, group savings, Ajo, withdrawals and loans.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  cloud_functions: ^6.0.0
  provider: ^6.1.2
  url_launcher: ^6.3.1
  app_links: ^6.4.0
  shared_preferences: ^2.3.2
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/branding/
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: NairaFallback
      fonts:
        - asset: assets/fonts/Naira-Regular.otf
          weight: 400
        - asset: assets/fonts/Naira-Medium.otf
          weight: 500
        - asset: assets/fonts/Naira-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Naira-Bold.otf
          weight: 700

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app-icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app-icon-foreground.png

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/splash-logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/branding/app-icon-foreground.png
